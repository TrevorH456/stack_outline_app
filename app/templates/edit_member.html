{% extends "base.html" %}

{% block content %}

<h1>Edit Member</h1>

<form method="POST">

    <div class="mb-3">
        <label>First Name</label>
        <input
            type="text"
            name="first_name"
            class="form-control"
            value="{{ member.first_name }}"
            required
        >
    </div>

    <div class="mb-3">
        <label>Last Name</label>
        <input
            type="text"
            name="last_name"
            class="form-control"
            value="{{ member.last_name }}"
            required
        >
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input
            type="email"
            name="email"
            class="form-control"
            value="{{ member.email }}"
            required
        >
    </div>

    <div class="mb-3">
        <label>Membership Level</label>
        <input
            type="text"
            name="membership_level"
            class="form-control"
            value="{{ member.membership_level }}"
            required
        >
    </div>

    <button type="submit" class="btn btn-success">Save Changes</button>
    <a href="/" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
